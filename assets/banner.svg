<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5" />
      <circle cx="40" cy="40" r="1" fill="#3b82f6" fill-opacity="0.3" />
    </pattern>

    <style>
      .pulse-line {
        stroke-dasharray: 8 16;
        animation: dashMove 12s linear infinite;
      }
      .pulse-line-fast {
        stroke-dasharray: 6 12;
        animation: dashMoveReverse 8s linear infinite;
      }
      .node-pulse {
        animation: pulseEffect 3s ease-in-out infinite alternate;
      }
      .node-pulse-alt {
        animation: pulseEffect 2.5s ease-in-out infinite alternate-reverse;
      }
      .float-pill-1 {
        animation: floatAnim1 5s ease-in-out infinite;
      }
      .float-pill-2 {
        animation: floatAnim2 6s ease-in-out infinite;
      }
      .float-pill-3 {
        animation: floatAnim3 5.5s ease-in-out infinite;
      }
      .float-pill-4 {
        animation: floatAnim4 6.5s ease-in-out infinite;
      }

      @keyframes dashMove {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 240; }
      }
      @keyframes dashMoveReverse {
        0% { stroke-dashoffset: 240; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseEffect {
        0% { transform: scale(0.95); opacity: 0.6; }
        100% { transform: scale(1.15); opacity: 1; }
      }
      @keyframes floatAnim1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatAnim2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes floatAnim3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes floatAnim4 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(7px); }
      }
      .text-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .text-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 400;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Ambient Background Glow Spheres -->
  <circle cx="200" cy="100" r="160" fill="#3b82f6" fill-opacity="0.08" filter="url(#glow)" />
  <circle cx="1000" cy="300" r="180" fill="#8b5cf6" fill-opacity="0.08" filter="url(#glow)" />
  <circle cx="600" cy="210" r="220" fill="#ec4899" fill-opacity="0.04" filter="url(#glow)" />

  <!-- Dynamic Distributed Network / Cluster Connections (Background) -->
  <g opacity="0.6">
    <line x1="120" y1="80" x2="310" y2="160" stroke="#3b82f6" stroke-width="1.5" class="pulse-line" />
    <line x1="310" y1="160" x2="220" y2="320" stroke="#6366f1" stroke-width="1.5" class="pulse-line-fast" />
    <line x1="220" y1="320" x2="90" y2="260" stroke="#06b6d4" stroke-width="1.5" class="pulse-line" />
    <line x1="90" y1="260" x2="120" y2="80" stroke="#3b82f6" stroke-width="1.5" class="pulse-line-fast" />

    <line x1="1080" y1="90" x2="940" y2="180" stroke="#8b5cf6" stroke-width="1.5" class="pulse-line" />
    <line x1="940" y1="180" x2="1050" y2="330" stroke="#ec4899" stroke-width="1.5" class="pulse-line-fast" />
    <line x1="1050" y1="330" x2="1140" y2="240" stroke="#a855f7" stroke-width="1.5" class="pulse-line" />
    <line x1="1140" y1="240" x2="1080" y2="90" stroke="#8b5cf6" stroke-width="1.5" class="pulse-line-fast" />

    <!-- Connecting Bridge Lines behind Title -->
    <path d="M 310 160 Q 600 70 940 180" fill="none" stroke="#4f46e5" stroke-width="1" stroke-opacity="0.4" class="pulse-line" />
    <path d="M 220 320 Q 600 370 1050 330" fill="none" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.4" class="pulse-line-fast" />
  </g>

  <!-- Network Cluster Nodes -->
  <g>
    <!-- Left Cluster Nodes -->
    <circle cx="120" cy="80" r="7" fill="#38bdf8" filter="url(#softGlow)" class="node-pulse" />
    <circle cx="120" cy="80" r="3" fill="#ffffff" />

    <circle cx="310" cy="160" r="8" fill="#6366f1" filter="url(#softGlow)" class="node-pulse-alt" />
    <circle cx="310" cy="160" r="3.5" fill="#ffffff" />

    <circle cx="220" cy="320" r="7" fill="#06b6d4" filter="url(#softGlow)" class="node-pulse" />
    <circle cx="220" cy="320" r="3" fill="#ffffff" />

    <circle cx="90" cy="260" r="6" fill="#818cf8" filter="url(#softGlow)" class="node-pulse-alt" />
    <circle cx="90" cy="260" r="2.5" fill="#ffffff" />

    <!-- Right Cluster Nodes -->
    <circle cx="1080" cy="90" r="7" fill="#c084fc" filter="url(#softGlow)" class="node-pulse" />
    <circle cx="1080" cy="90" r="3" fill="#ffffff" />

    <circle cx="940" cy="180" r="8" fill="#ec4899" filter="url(#softGlow)" class="node-pulse-alt" />
    <circle cx="940" cy="180" r="3.5" fill="#ffffff" />

    <circle cx="1050" cy="330" r="7" fill="#a855f7" filter="url(#softGlow)" class="node-pulse" />
    <circle cx="1050" cy="330" r="3" fill="#ffffff" />

    <circle cx="1140" cy="240" r="6" fill="#f43f5e" filter="url(#softGlow)" class="node-pulse-alt" />
    <circle cx="1140" cy="240" r="2.5" fill="#ffffff" />
  </g>

  <!-- Floating Dynamic Feature Badges (Positioned around periphery so text remains pristine) -->
  <g class="float-pill-1">
    <g transform="translate(140, 45)">
      <rect width="140" height="34" rx="17" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" filter="url(#softGlow)" />
      <circle cx="18" cy="17" r="4" fill="#38bdf8" />
      <text x="32" y="22" fill="#e2e8f0" class="badge-text">⚡ Key-Value</text>
    </g>
  </g>

  <g class="float-pill-2">
    <g transform="translate(920, 50)">
      <rect width="145" height="34" rx="17" fill="url(#pillGrad1)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.6" filter="url(#softGlow)" />
      <circle cx="18" cy="17" r="4" fill="#a855f7" />
      <text x="32" y="22" fill="#e2e8f0" class="badge-text">📄 Document</text>
    </g>
  </g>

  <g class="float-pill-3">
    <g transform="translate(130, 335)">
      <rect width="155" height="34" rx="17" fill="url(#pillGrad1)" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.6" filter="url(#softGlow)" />
      <circle cx="18" cy="17" r="4" fill="#06b6d4" />
      <text x="30" y="22" fill="#e2e8f0" class="badge-text">📊 Wide-Column</text>
    </g>
  </g>

  <g class="float-pill-4">
    <g transform="translate(910, 340)">
      <rect width="165" height="34" rx="17" fill="url(#pillGrad1)" stroke="#ec4899" stroke-width="1" stroke-opacity="0.6" filter="url(#softGlow)" />
      <circle cx="18" cy="17" r="4" fill="#ec4899" />
      <text x="30" y="22" fill="#e2e8f0" class="badge-text">🌐 Multi-Model / Graph</text>
    </g>
  </g>

  <!-- Central Foreground Content (Unobscured & High Contrast) -->
  <g id="foreground-content">
    <!-- Top Pill Tag -->
    <g transform="translate(470, 75)">
      <rect width="260" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" stroke-opacity="0.8" />
      <text x="130" y="20" fill="#a5b4fc" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">🚀 CURATED DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="165" text-anchor="middle" fill="url(#titleGrad)" class="text-title" font-size="52" filter="drop-shadow(0px 4px 12px rgba(0,0,0,0.8))">
      Awesome NoSQL Databases
    </text>

    <!-- Subtitle -->
    <text x="600" y="215" text-anchor="middle" fill="#cbd5e1" class="text-sub" font-size="19" font-weight="500" letter-spacing="0.2">
      Production-Grade SaaS Platforms &amp; Open-Source Distributed Storage Engines
    </text>

    <!-- Metrics / Tags Line -->
    <g transform="translate(320, 255)">
      <rect x="0" y="0" width="560" height="42" rx="21" fill="#0f172a" stroke="#334155" stroke-width="1" fill-opacity="0.8" />
      <text x="75" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600">
        📦 <tspan fill="#38bdf8">19+ OSS Repos</tspan>
      </text>
      <circle cx="170" cy="21" r="3" fill="#475569" />
      <text x="245" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600">
        ☁️ <tspan fill="#a78bfa">8+ Enterprise SaaS</tspan>
      </text>
      <circle cx="355" cy="21" r="3" fill="#475569" />
      <text x="445" y="26" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600">
        ⭐ <tspan fill="#f472b6">Sorted by Stars</tspan>
      </text>
    </g>
  </g>

  <!-- Clean Bottom Accent Line -->
  <line x1="0" y1="418" x2="1200" y2="418" stroke="url(#titleGrad)" stroke-width="3" stroke-opacity="0.7" />
</svg>
